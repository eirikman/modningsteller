name: Release check

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Tag matches manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compare tag with manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/modningsteller/manifest.json'))['version'])")
          echo "Tag: $tag, manifest: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match manifest version $manifest"
            exit 1
          fi
          if ! grep -qF "## [v$manifest]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [v$manifest]' section"
            exit 1
          fi
