decluttering_templates:
  modningsteller_oversikt:
    card:
      type: vertical-stack
      cards:
        - type: custom:modern-circular-gauge
          entity: sensor.[[id]]_dogngrader
          state_text: >-
            {% set v = states('sensor.[[id]]_dogngrader') | float(0) | round(1,
            'floor') %} {{ '0.0' if v == 0 else v }}
          secondary:
            entity: sensor.[[id]]_forventet_ferdigtid
            state_size: small
            smooth_segments: false
            show_seconds: false
            adaptive_state_color: false
            inverted_mode: false
            show_in_graph: false
            adaptive_graph_range: false
            label: >-
              {% if (states("sensor.[[id]]_gjenstaende_dogngrader")|float(0) <=
              0) or (states("sensor.[[id]]_status") != "running") %}
                {{""}}
              {%else%}
                {{'Timer igjen'}}
              {%endif%}
            unit_superscript: true
            state_text: >-
              {% if states("sensor.[[id]]_status") != "running" %}
                 {{state_translated("sensor.[[id]]_status")}}
              {% elif states("sensor.[[id]]_gjenstaende_dogngrader")|float(0) <=
              0 %}
                {{"Ferdig"}}
              {%endif%}
          max: 80
          tertiary:
            entity: sensor.[[id]]_middeltemperatur_siste_time
            show_state: true
            unit_superscript: true
            decimals: 1
            label: Temperatur
            show_unit: true
            state_text: |-
              {% if states("sensor.[[id]]_temperatursensorstatus") != "ok" %}
                 {{state_translated("sensor.[[id]]_temperatursensorstatus")}}
              {%endif%}
          segments:
            - from: 0
              color:
                - 10
                - 235
                - 119
            - from: 40
              color:
                - 220
                - 9
                - 9
          header_position: bottom
          show_icon: false
          show_header: true
          needle: true
          start_from_zero: false
          show_state: true
          show_unit: true
          unit_superscript: true
          adaptive_state_color: false
          show_seconds: false
          adaptive_label_color: false
          decimals: 1
          adaptive_graph_range: false
          show_graph: false
          show_in_graph: true
          gauge_foreground_style:
            width: 2
          unit: °C·d
          name: '{{device_name("sensor.[[id]]_dogngrader")}}'
          tap_action:
            action: navigate
            navigation_path: '#[[id]]'

  modningsteller_popup:
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-title-card
          title: Mørningsteller {{device_name("sensor.[[id]]_dogngrader")}}
          title_tap_action:
            action: none
          subtitle_tap_action:
            action: none
          grid_options:
            columns: full
        - type: custom:mushroom-chips-card
          chips:
            - type: entity
              entity: sensor.[[id]]_status
            - type: entity
              entity: sensor.[[id]]_temperatursensorstatus
            - type: entity
              entity: sensor.[[id]]_forventet_ferdigtid
              name:
                type: entity
            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.[[id]]_mal_nadd
                  state_not: unknown
                - condition: state
                  entity: sensor.[[id]]_mal_nadd
                  state_not: unavailable
              chip:
                type: entity
                entity: sensor.[[id]]_mal_nadd
        - type: tile
          grid_options:
            columns: full
          entity: text.[[id]]_notat
          name:
            type: entity
          vertical: false
          features_position: bottom
        - type: horizontal-stack
          cards:
            - type: tile
              entity: sensor.[[id]]_dogngrader
              name:
                type: entity
              features:
                - type: trend-graph
                - type: bar-gauge
                  max: 40
            - type: tile
              entity: sensor.[[id]]_middeltemperatur_siste_time
              name:
                type: entity
              vertical: false
              features:
                - type: trend-graph
              features_position: bottom
        - type: horizontal-stack
          cards:
            - type: tile
              entity: button.[[id]]_start
              name:
                type: entity
              hide_state: true
              vertical: false
              features_position: bottom
            - type: tile
              entity: button.[[id]]_pause
              name:
                type: entity
              hide_state: true
              vertical: false
              features_position: bottom
            - type: tile
              entity: button.[[id]]_nullstill
              name:
                type: entity
              hide_state: true
              vertical: false
              features_position: bottom
        - type: tile
          grid_options:
            columns: full
          entity: select.[[id]]_temperatursensor
          name:
            type: entity
          hide_state: true
          vertical: false
          features:
            - type: select-options
          features_position: bottom
        - type: horizontal-stack
          cards:
            - type: tile
              entity: number.[[id]]_kalibreringsverdi
              name:
                type: entity
              vertical: false
              features_position: bottom
            - type: tile
              entity: button.[[id]]_kalibrer
              name:
                type: entity
              hide_state: true
              vertical: false
              features_position: bottom
        - type: tile
          entity: text.[[id]]_kalibreringskommentar
          name:
            type: entity
          vertical: false
          features_position: bottom
          grid_options:
            columns: full

